<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOKUS</title>
<meta name="description" content="Pomodoro timer, task list and study stats with a plant that grows while you stay focused.">
<meta name="theme-color" content="#eef1ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FOKUS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script>
  // Phones, tablets and the installed app go straight to the app. Only desktops get the phone frame.
  (function () {
    var touch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 1;
    var narrow = matchMedia('(max-width: 760px)').matches;
    var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    if (touch || narrow || standalone || /[?&]app\b/.test(location.search)) location.replace('app.html');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Desktop prototype view: only the live app inside a phone frame. */
:root{
  --bg:#dfe5e1; --ink:#1d2622; --muted:#5d6a64; --accent:#2f7a55; --frame:#151a18; --card:#f8faf8;
  --display:"Azeret Mono", ui-monospace, Menlo, monospace;
  --body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);display:flex;align-items:center;justify-content:center;padding:16px;overflow:hidden}
.layout{display:flex;justify-content:center}
.phone{height:calc(100vh - 32px);min-height:640px;aspect-ratio:393/852;width:auto;max-width:calc(100vw - 32px);background:var(--frame);border-radius:56px;padding:14px;box-shadow:0 40px 80px -30px rgb(0 0 0 / .45),inset 0 0 0 2px #2c3330;position:relative}
.phone::before{content:"";position:absolute;top:24px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:var(--frame);border-radius:20px;z-index:2}
.screen{width:100%;height:100%;border-radius:44px;overflow:hidden;background:#eef1ee;display:flex;flex-direction:column}
.statusbar{height:50px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 34px 0;font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.02em}
.statusbar span:last-child{font-size:10px;letter-spacing:1px}
.phone iframe{flex:1;width:100%;border:0;display:block;background:#eef1ee}
</style>
</head>
<body>
<div class="layout">
  <div class="phone"><div class="screen"><div class="statusbar"><span id="clock">9:41</span><span>●●● ▮</span></div><iframe src="app.html" title="The FOKUS app"></iframe></div></div>
</div>
<script>var d=new Date();document.getElementById('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');</script>
</body>
</html>
